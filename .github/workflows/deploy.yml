name: Deploy Frontend

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      # Inject env globally (cleaner)
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm i   

      - name: Build
        run: npm run build

      # Upload dist to EC2 (temporary location)
      - name: Upload build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "dist/*"
          target: "/home/ubuntu/frontend-temp"

      # Deploy
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            echo "Cleaning old frontend..."
            sudo rm -rf /usr/share/nginx/html/*

            echo "Copying new build..."
            sudo cp -r /home/ubuntu/frontend-temp/* /usr/share/nginx/html/

            echo "Fixing permissions..."
            sudo chown -R www-data:www-data /usr/share/nginx/html

            echo "Reloading Nginx..."
            sudo systemctl restart nginx   # use restart not reload

            echo "Cleanup temp files..."
            rm -rf /home/ubuntu/frontend-temp

            echo " Deployment completed 🚀"
